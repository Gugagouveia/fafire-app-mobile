<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" role="img" aria-labelledby="title desc">
<title id="title">Wireframes iniciais — Estuda+</title><desc id="desc">Oito telas: login, cadastro, início, tarefas, detalhes, editor, biblioteca e perfil. Fluxos de autenticação, tarefas e leituras.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#17233b}.title{font-size:20px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#5e6a80}.box{fill:#f4f5f8;stroke:#a7afbf;rx:8}.line{stroke:#c3c9d5;stroke-width:8;stroke-linecap:round}</style><g id="phone"><rect width="260" height="430" rx="25" fill="white" stroke="#17233b" stroke-width="2"/><text x="20" y="30" class="small">9:41</text><line x1="100" y1="21" x2="160" y2="21" stroke="#17233b" stroke-width="5" stroke-linecap="round"/></g><g id="nav"><rect x="1" y="375" width="258" height="30" fill="#eef0f5"/><text x="15" y="395" class="small">Início    Tarefas    Livros    Perfil</text></g><g id="field"><rect x="20" width="220" height="44" class="box"/></g><g id="button"><rect x="20" width="220" height="44" rx="8" fill="#d6dbe7"/></g></defs>
<rect width="1240" height="1120" fill="#e8ecf4"/><text x="40" y="45" class="title">Estuda+ · Wireframes iniciais</text><text x="40" y="72" class="label">Gustavo Gouveia · Produtividade estudantil · Android / iOS</text>
<g transform="translate(40 110)"><use href="#phone"/><text x="20" y="80" class="title">1. Login</text><text x="20" y="112" class="label">Estuda+ / boas-vindas</text><use href="#field" y="143"/><text x="35" y="170" class="label">E-mail</text><use href="#field" y="203"/><text x="35" y="230" class="label">Senha</text><use href="#button" y="270"/><text x="102" y="297" class="label">Entrar</text><use href="#field" y="330"/><text x="75" y="357" class="label">Criar conta →</text></g>
<g transform="translate(340 110)"><use href="#phone"/><text x="20" y="80" class="title">2. Cadastro</text><use href="#field" y="110"/><text x="35" y="138" class="label">Nome</text><use href="#field" y="168"/><text x="35" y="195" class="label">E-mail</text><use href="#field" y="226"/><text x="35" y="253" class="label">Senha</text><use href="#field" y="284"/><text x="35" y="311" class="label">Confirmar senha</text><use href="#button" y="350"/><text x="90" y="378" class="label">Cadastrar</text></g>
<g transform="translate(640 110)"><use href="#phone"/><text x="20" y="80" class="title">3. Início</text><text x="20" y="112" class="label">Saudação do estudante</text><rect x="20" y="133" width="220" height="100" class="box"/><text x="35" y="165" class="label">Progresso: 33%</text><line x1="35" y1="200" x2="220" y2="200" class="line"/><text x="20" y="261" class="label">Pendentes / concluídas</text><use href="#button" y="280"/><text x="72" y="307" class="label">+ Nova tarefa</text><text x="20" y="352" class="label">Próximas entregas →</text><use href="#nav"/></g>
<g transform="translate(940 110)"><use href="#phone"/><text x="20" y="80" class="title">4. Tarefas</text><use href="#button" y="110"/><text x="76" y="138" class="label">+ Nova tarefa</text><use href="#field" y="170"/><text x="35" y="197" class="label">Busca / filtros</text><rect x="20" y="235" width="220" height="55" class="box"/><text x="35" y="268" class="label">Tarefa + prazo →</text><rect x="20" y="303" width="220" height="55" class="box"/><text x="35" y="336" class="label">Tarefa + status →</text><use href="#nav"/></g>
<g transform="translate(40 610)"><use href="#phone"/><text x="20" y="80" class="title">5. Detalhes</text><text x="20" y="114" class="label">Título e disciplina</text><rect x="20" y="136" width="220" height="100" class="box"/><text x="35" y="163" class="label">Prazo / prioridade</text><text x="35" y="210" class="label">Anotações</text><use href="#button" y="255"/><text x="70" y="282" class="label">Concluir / reabrir</text><use href="#field" y="313"/><text x="106" y="340" class="label">Editar</text><text x="90" y="390" class="label">Excluir ⚠</text></g>
<g transform="translate(340 610)"><use href="#phone"/><text x="20" y="80" class="title">6. Editor</text><use href="#field" y="110"/><text x="35" y="138" class="label">Título</text><use href="#field" y="166"/><text x="35" y="194" class="label">Disciplina</text><use href="#field" y="222"/><text x="35" y="250" class="label">Prazo / prioridade</text><use href="#field" y="278"/><text x="35" y="306" class="label">Anotações</text><use href="#button" y="350"/><text x="78" y="378" class="label">Salvar tarefa</text></g>
<g transform="translate(640 610)"><use href="#phone"/><text x="20" y="80" class="title">7. Biblioteca</text><use href="#field" y="110"/><text x="35" y="138" class="label">Título / autor / assunto</text><use href="#button" y="169"/><text x="103" y="197" class="label">Buscar</text><rect x="20" y="232" width="220" height="125" class="box"/><text x="35" y="259" class="label">Livro / autor / ano</text><text x="35" y="301" class="label">Criar tarefa de leitura →</text><text x="35" y="337" class="small">Link / cache offline</text><use href="#nav"/></g>
<g transform="translate(940 610)"><use href="#phone"/><text x="20" y="80" class="title">8. Perfil</text><circle cx="130" cy="134" r="30" fill="#d6dbe7"/><text x="80" y="195" class="label">Nome / e-mail</text><use href="#button" y="228"/><text x="68" y="255" class="label">Exportar JSON</text><text x="20" y="301" class="small">Privacidade / uso offline</text><use href="#field" y="317"/><text x="86" y="345" class="label">Sair da conta</text><use href="#nav"/></g>
<text x="40" y="1080" class="label">Fluxos: Login ↔ Cadastro → Início → Tarefas → Detalhes ↔ Editor · Biblioteca → Editor · Perfil → arquivo nativo</text>
</svg>
